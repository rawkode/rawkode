name: Apsides
options:
  bundleIdPrefix: rawkode.academy
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "6KXCJGJ45W"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  ApsidesCore:
    path: .
targets:
  ApsidesMac:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: Resources/MacAssets.xcassets
        buildPhase: resources
      - Sources/SharedUI
      - Sources/Platform
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ApsidesCore
    settings:
      base:
        PRODUCT_NAME: Enchiridion
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.mac
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Configuration/Mac-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Enchiridion
        CFBundleURLTypes:
          - CFBundleURLSchemes: [enchiridion]
  ApsidesIOS:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - Sources/SharedUI
      - Sources/Platform
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ApsidesCore
      - target: ApsidesWatch
        embed: true
      - target: ApsidesWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Enchiridion
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
    info:
      path: Configuration/iOS-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Enchiridion
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [enchiridion]
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight,
        ]
        UISupportedInterfaceOrientations~ipad: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight,
        ]
  ApsidesWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/Watch
      - Sources/Platform/WatchBridge.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ApsidesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.watchkitapp
        PRODUCT_NAME: Enchiridion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Watch-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Enchiridion
        WKApplication: true
        WKCompanionAppBundleIdentifier: rawkode.academy.enchiridion
  ApsidesWidget:
    type: app-extension
    platform: iOS
    sources: [Sources/Widget]
    dependencies:
      - package: ApsidesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.widget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/Widget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Configuration/Widget-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Up Next
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ApsidesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: ApsidesIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApsidesMac:
    build:
      targets:
        ApsidesMac: all
  ApsidesIOS:
    build:
      targets:
        ApsidesIOS: all
    test:
      targets: [ApsidesUITests]
      environmentVariables:
        APSIDES_EDITOR_TEST_ORIGIN: "$(APSIDES_EDITOR_TEST_ORIGIN)"
    archive:
      config: Release
  ApsidesWatch:
    build:
      targets:
        ApsidesWatch: all
