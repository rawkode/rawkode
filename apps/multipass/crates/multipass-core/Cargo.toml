[package]
name = "multipass-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "multipass-engine"
path = "src/bin/multipass-engine.rs"

[dependencies]
multipass-network = { path = "../multipass-network" }
multipass-hardware = { path = "../multipass-hardware" }
anyhow = "1"
base64 = "0.22"
directories = "6"
hostname = "0.4"
fs2 = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
