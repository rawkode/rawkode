[package]
name = "multipass-hardware"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Properties", "Win32_System_WinRT"] }
windows-collections = "0.3"
windows-future = "0.3"
