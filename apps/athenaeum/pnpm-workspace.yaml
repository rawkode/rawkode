packages:
  - packages/*
  # Deploy-time IaC (Alchemy) — its own workspace package, NOT under packages/*, because it must
  # depend on effect@4.0.0-rc (alchemy@2.0.0-beta's required peer range is >=4.0.0-rc.110) while
  # every packages/* consumer stays on the catalog's effect@3.22.1. pnpm keeps the two majors
  # fully isolated per-package; infra/ deliberately does not use the effect catalog entry.
  - infra

allowBuilds:
  '@swc/core': set this to true or false
  esbuild: true
  # Transitive native accelerator pulled in via alchemy's dependency tree; msgpackr works
  # without its native build, so the postinstall script stays off.
  msgpackr-extract: false
  workerd: true

# Toolchain/dependency versions shared across packages/*, confirmed live against npm on
# 2026-08-20 (see apps/athenaeum scouting report). Declared once here so a bump is one edit.
catalog:
  effect: 3.22.1
  capnweb: ^0.11.1
  wrangler: ^4.124.0
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20260820.1
  # Pinned to cloudflare-os's exact version rather than the current vite@8 latest: vite@8
  # compatibility with wrangler/vitest-pool-workers is unverified for this stack (see scouting
  # report). Revisit once vite@8 + vitest-pool-workers is confirmed working.
  vite: 7.3.6
  vitest: ^4.1.10
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  # ^6.x requires vite's ./internal export subpath, only stable-exported starting vite 8;
  # our vite is pinned to 7.3.6 (see above), so pin to cloudflare-os's known-working version.
  '@vitejs/plugin-react': ^5.2.0
  typescript: ^5.9.3
  # CRDT for Automerge note-body storage (plan §"Storage & domain model": "CRDT choice:
  # Automerge... not Yjs"). 3.x ships a `workerd` package.json export condition
  # (`dist/mjs/entrypoints/fullfat_workerd.js`) — real, official Cloudflare Workers/workerd
  # support, not a bundler workaround — confirmed live against npm on 2026-08-20.
  '@automerge/automerge': ^3.4.1

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260820.1'
  - '@vitejs/plugin-react@6.1.0'
  - '@automerge/automerge@3.4.1'
  - prosemirror-changeset@2.4.2
  - '@alchemy.run/cloudflare-runtime@2.0.0-beta.74'
  - '@alchemy.run/floci@2.0.0-beta.74'
  - '@alchemy.run/node-utils@2.0.0-beta.74'
  - '@distilled.cloud/aws@1.0.0-rc.6'
  - '@distilled.cloud/axiom@1.0.0-rc.6'
  - '@distilled.cloud/cloudflare@1.0.0-rc.6'
  - '@distilled.cloud/core@1.0.0-rc.6'
  - '@distilled.cloud/fly-io@1.0.0-rc.6'
  - '@distilled.cloud/hetzner@1.0.0-rc.6'
  - '@distilled.cloud/neon@1.0.0-rc.6'
  - '@distilled.cloud/planetscale@1.0.0-rc.6'
  - alchemy@2.0.0-beta.74
