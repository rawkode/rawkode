name: Enchiridion
options:
  bundleIdPrefix: rawkode.academy
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "6KXCJGJ45W"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  WebRTC:
    path: Vendor/WebRTC
  EnchiridionCore:
    path: .
targets:
  EnchiridionMac:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: Resources/MacAssets.xcassets
        buildPhase: resources
      - Sources/SharedUI
      - Sources/Platform
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WebRTC
      - package: EnchiridionCore
    postBuildScripts:
      - name: Include WebRTC debug symbols
        script: '"${SRCROOT}/scripts/install-webrtc-dsym.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: Enchiridion
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Configuration/Mac-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Enchiridion
        NSCameraUsageDescription: Enchiridion includes a communication library with camera support. Voice conversations are audio-only and do not access your camera.
        NSMicrophoneUsageDescription: Enchiridion uses the microphone for voice conversations you choose to start.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [enchiridion]
  EnchiridionIOS:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - Sources/SharedUI
      - Sources/Platform
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WebRTC
      - package: EnchiridionCore
      - target: EnchiridionWatch
        embed: true
      - target: EnchiridionWidget
        embed: true
    postBuildScripts:
      - name: Include WebRTC debug symbols
        script: '"${SRCROOT}/scripts/install-webrtc-dsym.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: Enchiridion
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
    info:
      path: Configuration/iOS-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Enchiridion
        NSCameraUsageDescription: Enchiridion includes a communication library with camera support. Voice conversations are audio-only and do not access your camera.
        NSMicrophoneUsageDescription: Enchiridion uses the microphone for voice conversations and meetings you choose to record.
        NSSpeechRecognitionUsageDescription: Enchiridion turns meeting audio into notes while you record.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: EnchiridionCarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [enchiridion]
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight,
        ]
        UISupportedInterfaceOrientations~ipad: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight,
        ]
  EnchiridionWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/Watch
      - Sources/Platform/WatchBridge.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: EnchiridionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.watchkitapp
        PRODUCT_NAME: Enchiridion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Watch-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Enchiridion
        WKApplication: true
        WKCompanionAppBundleIdentifier: rawkode.academy.enchiridion
  EnchiridionWidget:
    type: app-extension
    platform: iOS
    sources: [Sources/Widget]
    dependencies:
      - package: EnchiridionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.widget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/Widget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Configuration/Widget-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Up Next
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  EnchiridionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: EnchiridionIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rawkode.academy.enchiridion.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EnchiridionMac:
    build:
      targets:
        EnchiridionMac: all
  EnchiridionIOS:
    build:
      targets:
        EnchiridionIOS: all
    test:
      targets: [EnchiridionUITests]
      environmentVariables:
        ENCHIRIDION_EDITOR_TEST_ORIGIN: "$(ENCHIRIDION_EDITOR_TEST_ORIGIN)"
    archive:
      config: Release
  EnchiridionWatch:
    build:
      targets:
        EnchiridionWatch: all
