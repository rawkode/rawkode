<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'nonce-enchiridion-bootstrap'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://www.youtube-nocookie.com; connect-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Enchiridion Editor</title>
    <script nonce="enchiridion-bootstrap">
      const showBootstrapError = (reason) => {
        const status = document.getElementById("status")
        if (status) status.textContent = `Editor failed to load: ${reason?.message ?? reason}`
      }
      window.addEventListener("error", event => showBootstrapError(event.error ?? event.message))
      window.addEventListener("unhandledrejection", event => showBootstrapError(event.reason))
    </script>
  </head>
  <body>
    <main id="app">
      <div id="status" role="status" aria-live="polite">Loading editor…</div>
      <textarea id="title" aria-label="Page title" placeholder="Untitled" rows="1" disabled></textarea>
      <section id="page-context" class="page-context" aria-label="Calendar context" hidden></section>
      <div id="editor" aria-label="Page body"></div>
      <section id="find-bar" class="find-bar" role="search" aria-label="Find in page" hidden></section>
      <div id="slash-menu" class="palette" hidden></div>
      <div id="page-menu" class="palette" hidden></div>
      <div id="link-menu" class="palette link-editor" hidden></div>
      <div id="mobile-command-bar" class="mobile-command-bar" role="toolbar" aria-label="Editor commands" hidden>
        <button type="button" data-command="undo" aria-label="Undo" disabled><span aria-hidden="true">↶</span></button>
        <button type="button" data-command="redo" aria-label="Redo" disabled><span aria-hidden="true">↷</span></button>
        <button type="button" data-command="blocks" aria-label="Block style, Text" aria-pressed="false" aria-controls="slash-menu" disabled>Aa</button>
        <button type="button" data-command="bold" aria-label="Bold" aria-pressed="false" disabled><strong aria-hidden="true">B</strong></button>
        <button type="button" data-command="italic" aria-label="Italic" aria-pressed="false" disabled><em aria-hidden="true">I</em></button>
        <button type="button" data-command="inline-code" aria-label="Inline code" aria-pressed="false" disabled><code aria-hidden="true">&lt;/&gt;</code></button>
        <button type="button" data-command="bullet-list" aria-label="Bulleted list" aria-pressed="false" disabled><span aria-hidden="true">•≡</span></button>
        <button type="button" data-command="link-reference" aria-label="Link or reference" aria-pressed="false" aria-controls="page-menu link-menu" disabled><span aria-hidden="true">@</span></button>
        <button type="button" data-command="dismiss-keyboard" aria-label="Dismiss keyboard"><span aria-hidden="true">⌄</span></button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
