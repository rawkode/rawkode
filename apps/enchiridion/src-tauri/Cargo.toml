[package]
name = "enchiridion"
version = "0.1.0"
description = "A local-first daily notebook"
edition = "2021"
rust-version = "1.88"

[lib]
name = "enchiridion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
loro = "1.16.0"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSPathUtilities"] }

# Rust issue157750: stripped proc-macro dylibs fail to load on macOS27.
[profile.release]
strip = false
