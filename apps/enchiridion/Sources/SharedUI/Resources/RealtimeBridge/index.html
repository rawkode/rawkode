<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'sha256-cYuwdruSo0h3LOJEOBlMzVoMxczCn8ARuILKqy/RMIg='; connect-src 'none'; img-src 'none'; style-src 'none'; font-src 'none'; media-src blob: mediastream:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'"
  >
  <meta name="referrer" content="no-referrer">
  <title>Enchiridion Realtime Audio</title>
</head>
<body>
<audio id="remote-audio" autoplay></audio>
<script>
(() => {
  "use strict";

  const MAX_SDP_BYTES = 131072;
  const MAX_EVENT_BYTES = 65536;
  const MAX_ERROR_BYTES = 512;
  const METER_INTERVAL_MILLISECONDS = 50;
  const bridge = window.webkit.messageHandlers.realtime;
  const remoteAudio = document.getElementById("remote-audio");
  let generation = 0;
  let transportEpoch = 0;
  let peer = null;
  let channel = null;
  let microphone = null;
  let audioContext = null;
  let inputAnalyser = null;
  let outputAnalyser = null;
  let meterTimer = null;
  let INPUT_RECOVERY_TIMEOUT_MILLISECONDS = 3000;
  let inputQueue = Promise.resolve();
  let inputEpoch = 0;

  function byteLength(value) {
    return new TextEncoder().encode(value).byteLength;
  }

  function post(messageGeneration, type, payload = {}) {
    bridge.postMessage(Object.freeze({ version: 1, generation: messageGeneration, type, payload }));
  }

  function boundedString(value, maximum, name) {
    if (typeof value !== "string" || byteLength(value) > maximum) {
      throw new Error(`${name} is invalid`);
    }
    return value;
  }

  function validGeneration(value) {
    return Number.isSafeInteger(value) && value > 0;
  }

  function requireCurrentGeneration(options) {
    if (!validGeneration(options.generation) || generation === 0 || options.generation !== generation) {
      throw new Error("generation is invalid");
    }
    return generation;
  }

  function staleTransportError() {
    const error = new Error("transport is stale");
    error.isStaleTransport = true;
    return error;
  }

  function isAttemptCurrent(sessionGeneration, sessionEpoch) {
    return generation === sessionGeneration && transportEpoch === sessionEpoch;
  }

  function isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream) {
    return isAttemptCurrent(sessionGeneration, sessionEpoch)
      && peer === sessionPeer
      && channel === sessionChannel
      && microphone === sessionStream;
  }

  function inputOperationCurrent(sessionGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, sessionStream) {
    return inputEpoch === operationEpoch
      && isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream);
  }

  function withInputDeadline(operation) {
    return Promise.race([
      operation(),
      new Promise((_, reject) => setTimeout(() => reject(new Error("input recovery timed out")), INPUT_RECOVERY_TIMEOUT_MILLISECONDS))
    ]);
  }

  function requireAttemptCurrent(sessionGeneration, sessionEpoch) {
    if (!isAttemptCurrent(sessionGeneration, sessionEpoch)) throw staleTransportError();
  }

  function cleanupTransport(sessionPeer, sessionChannel, sessionStream, clearAudio) {
    stopMetering();
    if (sessionChannel) {
      sessionChannel.onopen = null;
      sessionChannel.onclose = null;
      sessionChannel.onerror = null;
      sessionChannel.onmessage = null;
      sessionChannel.close();
    }
    if (sessionStream) {
      for (const track of sessionStream.getTracks()) track.stop();
    }
    if (sessionPeer) {
      sessionPeer.onconnectionstatechange = null;
      sessionPeer.ontrack = null;
      sessionPeer.close();
    }
    if (clearAudio) {
      remoteAudio.pause();
      remoteAudio.srcObject = null;
    }
  }

  function normalizedLevel(analyser) {
    if (!analyser) return 0;
    const samples = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const sample of samples) sum += sample * sample;
    const level = Math.sqrt(sum / samples.length);
    return Number.isFinite(level) ? Math.min(1, Math.max(0, level)) : 0;
  }

  function stopMetering() {
    if (meterTimer !== null) clearInterval(meterTimer);
    meterTimer = null;
    inputAnalyser = null;
    outputAnalyser = null;
    if (audioContext) void audioContext.close().catch(() => {});
    audioContext = null;
  }

  function startMetering(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream) {
    stopMetering();
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    try {
      audioContext = new Context();
      inputAnalyser = audioContext.createAnalyser();
      inputAnalyser.fftSize = 256;
      audioContext.createMediaStreamSource(sessionStream).connect(inputAnalyser);
      meterTimer = setInterval(() => {
        if (!isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) return;
        post(sessionGeneration, "audioActivity", {
          inputLevel: normalizedLevel(inputAnalyser),
          outputLevel: normalizedLevel(outputAnalyser)
        });
      }, METER_INTERVAL_MILLISECONDS);
    } catch (_) {
      stopMetering();
    }
  }

  function attachRemoteMeter(stream, sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream) {
    if (!audioContext || !isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) return;
    try {
      outputAnalyser = audioContext.createAnalyser();
      outputAnalyser.fftSize = 256;
      audioContext.createMediaStreamSource(stream).connect(outputAnalyser);
    } catch (_) {
      outputAnalyser = null;
    }
  }

  function invalidateCurrentTransport() {
    transportEpoch += 1;
    const previousPeer = peer;
    const previousChannel = channel;
    const previousStream = microphone;
    peer = null;
    channel = null;
    microphone = null;
    cleanupTransport(previousPeer, previousChannel, previousStream, true);
    return transportEpoch;
  }

  function authorize(options) {
    if (!validGeneration(options.generation)) throw new Error("generation is invalid");
    invalidateCurrentTransport();
    generation = options.generation;
    inputEpoch = 0;
  }

  function stop(options) {
    requireCurrentGeneration(options);
    // A terminal native lease fences every queued enable before teardown.
    inputEpoch = Number.MAX_SAFE_INTEGER;
    const track = microphone && canonicalAudioTrack(microphone);
    if (track) track.enabled = false;
    generation = 0;
    invalidateCurrentTransport();
  }

  async function start(options) {
    const sessionGeneration = requireCurrentGeneration(options);
    const sessionEpoch = invalidateCurrentTransport();
    let sessionPeer = null;
    let sessionChannel = null;
    let sessionStream = null;
    try {
      sessionPeer = new RTCPeerConnection({
        bundlePolicy: "max-bundle",
        rtcpMuxPolicy: "require",
        iceServers: []
      });
      sessionPeer.onconnectionstatechange = () => {
        if (!isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) return;
        post(sessionGeneration, "connectionState", { state: sessionPeer.connectionState });
      };
      sessionPeer.ontrack = (event) => {
        if (!isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) return;
        if (event.track.kind !== "audio" || event.streams.length !== 1) {
          post(sessionGeneration, "error", { code: "unexpectedRemoteMedia" });
          return;
        }
        remoteAudio.srcObject = event.streams[0];
        attachRemoteMeter(
          event.streams[0], sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream
        );
        void remoteAudio.play().catch(() => {
          if (isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) {
            post(sessionGeneration, "error", { code: "remoteAudioPlaybackFailed" });
          }
        });
      };

      sessionChannel = sessionPeer.createDataChannel("oai-events", { ordered: true });
      sessionChannel.onopen = () => {
        if (isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) {
          post(sessionGeneration, "dataChannelState", { state: "open" });
        }
      };
      sessionChannel.onclose = () => {
        if (isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) {
          post(sessionGeneration, "dataChannelState", { state: "closed" });
        }
      };
      sessionChannel.onerror = () => {
        if (isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) {
          post(sessionGeneration, "error", { code: "dataChannelFailed" });
        }
      };
      sessionChannel.onmessage = (event) => {
        if (!isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) return;
        if (typeof event.data !== "string" || byteLength(event.data) > MAX_EVENT_BYTES) {
          post(sessionGeneration, "error", { code: "serverEventRejected" });
          return;
        }
        post(sessionGeneration, "serverEvent", { json: event.data });
      };

      sessionStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      requireAttemptCurrent(sessionGeneration, sessionEpoch);
      for (const track of sessionStream.getTracks()) track.enabled = false;
      const audioTracks = sessionStream.getAudioTracks();
      const videoTracks = sessionStream.getVideoTracks();
      if (audioTracks.length !== 1 || videoTracks.length !== 0) {
        throw new Error("microphone track is unavailable");
      }
      sessionPeer.addTrack(audioTracks[0], sessionStream);

      const offer = await sessionPeer.createOffer({ offerToReceiveAudio: true });
      requireAttemptCurrent(sessionGeneration, sessionEpoch);
      await sessionPeer.setLocalDescription(offer);
      requireAttemptCurrent(sessionGeneration, sessionEpoch);
      peer = sessionPeer;
      channel = sessionChannel;
      microphone = sessionStream;
      startMetering(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream);
      const sdp = boundedString(sessionPeer.localDescription.sdp, MAX_SDP_BYTES, "offer SDP");
      post(sessionGeneration, "offer", { sdp });
    } catch (error) {
      const attemptWasCurrent = isAttemptCurrent(sessionGeneration, sessionEpoch);
      cleanupTransport(sessionPeer, sessionChannel, sessionStream, attemptWasCurrent);
      if (attemptWasCurrent) {
        peer = null;
        channel = null;
        microphone = null;
        transportEpoch += 1;
        throw error;
      }
      throw staleTransportError();
    }
  }

  async function setAnswer(answer) {
    const messageGeneration = requireCurrentGeneration(answer);
    const sessionEpoch = transportEpoch;
    const sessionPeer = peer;
    const sessionChannel = channel;
    const sessionStream = microphone;
    if (!sessionPeer || sessionPeer.signalingState === "closed") throw new Error("peer is unavailable");
    const sdp = boundedString(answer.sdp, MAX_SDP_BYTES, "answer SDP");
    try {
      await sessionPeer.setRemoteDescription({ type: "answer", sdp });
    } catch (error) {
      if (!isTransportCurrent(messageGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) {
        throw staleTransportError();
      }
      throw error;
    }
    if (!isTransportCurrent(messageGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)) {
      throw staleTransportError();
    }
    post(messageGeneration, "answerApplied");
  }

  function sendEvent(message) {
    const messageGeneration = requireCurrentGeneration(message);
    const sessionEpoch = transportEpoch;
    const sessionPeer = peer;
    const sessionChannel = channel;
    const sessionStream = microphone;
    const json = boundedString(message.json, MAX_EVENT_BYTES, "client event");
    if (!sessionPeer || !sessionChannel || !sessionStream
      || !isTransportCurrent(messageGeneration, sessionEpoch, sessionPeer, sessionChannel, sessionStream)
      || sessionPeer.connectionState === "closed"
      || sessionChannel.readyState !== "open") {
      throw new Error("data channel is unavailable");
    }
    sessionChannel.send(json);
  }

  function canonicalAudioTrack(stream) {
    const audioTracks = stream?.getAudioTracks?.() || [];
    const videoTracks = stream?.getVideoTracks?.() || [];
    if (audioTracks.length !== 1 || videoTracks.length !== 0) throw new Error("microphone track is invalid");
    return audioTracks[0];
  }

  function isHealthyInputTrack(track, stream) {
    return !!track && stream?.active === true && track.readyState === "live" && track.muted !== true;
  }

  async function restoreInputSender(sender, oldTrack, replacementTrack, sessionPeer) {
    if (!sender || sender.track !== replacementTrack || !sessionPeer || sessionPeer.connectionState === "closed") {
      return sender?.track !== replacementTrack;
    }
    try {
      // Do not race this compensating operation against a timeout: Promise
      // cancellation would leave a late rollback able to mutate the sender
      // after its caller had reconciled microphone state.
      await sender.replaceTrack(oldTrack);
      return sender.track === oldTrack;
    } catch (_) {
      return false;
    }
  }

  async function recoverInputTrack(sessionGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, oldStream, oldTrack) {
    post(sessionGeneration, "inputCaptureState", { state: "recovering" });
    let replacementStream = null;
    let replacementTrack = null;
    let replacementSender = null;
    try {
      if (audioContext && audioContext.state === "suspended") {
        await withInputDeadline(() => audioContext.resume());
      }
      replacementStream = await withInputDeadline(() => navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false
      }));
      replacementTrack = canonicalAudioTrack(replacementStream);
      replacementTrack.enabled = false;
      if (!inputOperationCurrent(sessionGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, oldStream)
        || sessionPeer.connectionState === "closed") throw staleTransportError();
      const senders = sessionPeer.getSenders().filter((sender) => sender.track === oldTrack && sender.track?.kind === "audio");
      if (senders.length !== 1) throw new Error("microphone sender is invalid");
      replacementSender = senders[0];
      // A raced timeout cannot cancel replaceTrack. Wait for its actual
      // completion so a late sender mutation is always reconciled below.
      await replacementSender.replaceTrack(replacementTrack);
      if (!inputOperationCurrent(sessionGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, oldStream)
        || sessionPeer.connectionState === "closed" || replacementSender.track !== replacementTrack) {
        const restored = await restoreInputSender(replacementSender, oldTrack, replacementTrack, sessionPeer);
        // If teardown won the race, preserve the track that WebRTC actually
        // owns so the queued newer disable can silence it. Do not stop an
        // attached replacement and strand the sender on a dead track.
        if (!restored && isTransportCurrent(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, oldStream)
          && sessionPeer.connectionState !== "closed" && replacementSender.track === replacementTrack) {
          microphone = replacementStream;
          startMetering(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, replacementStream);
          replacementStream = null;
        }
        throw staleTransportError();
      }
      microphone = replacementStream;
      startMetering(sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, replacementStream);
      if (remoteAudio.srcObject) attachRemoteMeter(remoteAudio.srcObject, sessionGeneration, sessionEpoch, sessionPeer, sessionChannel, replacementStream);
      for (const track of oldStream.getTracks()) track.stop();
      post(sessionGeneration, "inputCaptureState", { state: "recovered" });
      return replacementTrack;
    } catch (error) {
      if (replacementStream) for (const track of replacementStream.getTracks()) track.stop();
      if (error?.isStaleTransport === true) throw error;
      post(sessionGeneration, "inputCaptureState", { state: "unavailable" });
      throw error;
    }
  }

  function setInputEnabled(message) {
    const messageGeneration = requireCurrentGeneration(message);
    if (typeof message.enabled !== "boolean") throw new Error("enabled is invalid");
    if (!Number.isSafeInteger(message.inputEpoch) || message.inputEpoch <= 0 || message.inputEpoch <= inputEpoch) {
      throw new Error("input epoch is invalid");
    }
    const operationEpoch = message.inputEpoch;
    inputEpoch = operationEpoch;
    // Disabling is intentionally synchronous: it immediately silences the
    // attached microphone even while an older recovery is awaiting media.
    if (!message.enabled && microphone) canonicalAudioTrack(microphone).enabled = false;
    const operation = inputQueue.then(async () => {
      const sessionEpoch = transportEpoch;
      const sessionPeer = peer;
      const sessionChannel = channel;
      const sessionStream = microphone;
      if (!sessionPeer || !sessionChannel || !sessionStream
        || !inputOperationCurrent(messageGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, sessionStream)
        || sessionPeer.connectionState === "closed") throw new Error("microphone is unavailable");
      let track = canonicalAudioTrack(sessionStream);
      if (!message.enabled) {
        track.enabled = false;
        return;
      }
      if (!isHealthyInputTrack(track, sessionStream)) {
        track = await recoverInputTrack(messageGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, sessionStream, track);
      }
      if (!inputOperationCurrent(messageGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, microphone)
        || sessionPeer.connectionState === "closed" || !isHealthyInputTrack(track, microphone)) throw staleTransportError();
      await withInputDeadline(async () => { track.enabled = true; });
      if (!inputOperationCurrent(messageGeneration, sessionEpoch, operationEpoch, sessionPeer, sessionChannel, microphone)
        || sessionPeer.connectionState === "closed" || track.enabled !== true) throw staleTransportError();
    });
    inputQueue = operation.catch(() => {});
    return operation;
  }

  function expose(operation) {
    return async (argument = {}) => {
      try {
        return await operation(argument);
      } catch (error) {
        if (error?.isStaleTransport !== true && argument.generation === generation && generation > 0) {
          post(generation, "error", { code: "bridgeOperationFailed" });
        }
        throw error;
      }
    };
  }

  window.EnchiridionRealtimeBridge = Object.freeze({
    authorize: expose(authorize),
    start: expose(start),
    setAnswer: expose(setAnswer),
    sendEvent: expose(sendEvent),
    setInputEnabled: expose(setInputEnabled),
    stop: expose(stop)
  });
  post(0, "ready");
})();
</script>
</body>
</html>
