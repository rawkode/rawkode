name: Enchiridion

options:
  bundleIdPrefix: dev.rawkode
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  generateEmptyDirectories: true

packages:
  EnchiridionCore:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: 6KXCJGJ45W
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2026080301"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  EnchiridionMac:
    type: application
    platform: macOS
    productName: Enchiridion
    info:
      path: Configuration/EnchiridionMac-Info.plist
      properties:
        CFBundleDisplayName: Enchiridion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Enchiridion shows your local calendar events so you can attach private notes. It never edits events.
        NSContactsUsageDescription: Enchiridion uses contacts you allow to enrich people already found in your calendars. It never imports your address book.
        NSMicrophoneUsageDescription: Enchiridion uses the microphone for Apple On Device voice and selected cloud voice providers. OpenAI Voice requires explicit voice consent. Saving a verified Qwen token is your explicit opt-in to send live audio to Qwen Audio Realtime in China (Beijing).
        NSSpeechRecognitionUsageDescription: Enchiridion transcribes your questions on device so it can answer from your private calendar and notes.
        GoogleOAuthClientID: CONFIGURE_GOOGLE_OAUTH_CLIENT_ID
        GoogleOAuthRedirectScheme: enchiridion-google-oauth-unconfigured
        EnchiridionCodeSignEntitlements: $(CODE_SIGN_ENTITLEMENTS)
        EnchiridionCodeSigningAllowed: $(CODE_SIGNING_ALLOWED)
        CFBundleURLTypes:
          - CFBundleURLName: Enchiridion Tasks
            CFBundleURLSchemes:
              - enchiridion
          - CFBundleURLName: Google Calendar OAuth
            CFBundleURLSchemes:
              - enchiridion-google-oauth-unconfigured
    sources:
      - path: Sources/SharedUI
        excludes:
          - Resources
      - Sources/macOS
      - path: Sources/SharedUI/Resources/RealtimeBridge
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AppIntents.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: FoundationModels.framework
        weak: true
      - sdk: Speech.framework
      - sdk: WebKit.framework
      - package: EnchiridionCore
        product: EnchiridionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rawkode.enchiridion
        PRODUCT_NAME: Enchiridion
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Configuration/EnchiridionMac.entitlements
        CODE_SIGN_STYLE: Automatic

  EnchiridionMobile:
    type: application
    platform: iOS
    productName: Enchiridion
    info:
      path: Configuration/EnchiridionMobile-Info.plist
      properties:
        CFBundleDisplayName: Enchiridion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay Voice
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes:
          - audio
          - remote-notification
        NSCalendarsFullAccessUsageDescription: Enchiridion shows your local calendar events so you can attach private notes. It never edits events.
        NSContactsUsageDescription: Enchiridion uses contacts you allow to enrich people already found in your calendars. It never imports your address book.
        NSMicrophoneUsageDescription: Enchiridion uses the microphone for Apple On Device voice and selected cloud voice providers. OpenAI Voice requires explicit voice consent. Saving a verified Qwen token is your explicit opt-in to send live audio to Qwen Audio Realtime in China (Beijing).
        NSSpeechRecognitionUsageDescription: Enchiridion transcribes your questions on device so it can answer from your private calendar and notes.
        GoogleOAuthClientID: CONFIGURE_GOOGLE_OAUTH_CLIENT_ID
        GoogleOAuthRedirectScheme: enchiridion-google-oauth-unconfigured
        EnchiridionCodeSignEntitlements: $(CODE_SIGN_ENTITLEMENTS)
        EnchiridionCodeSigningAllowed: $(CODE_SIGNING_ALLOWED)
        CFBundleURLTypes:
          - CFBundleURLName: Enchiridion Tasks
            CFBundleURLSchemes:
              - enchiridion
          - CFBundleURLName: Google Calendar OAuth
            CFBundleURLSchemes:
              - enchiridion-google-oauth-unconfigured
    sources:
      - path: Sources/SharedUI
        excludes:
          - Resources
      - Sources/iOS
      - path: Sources/SharedUI/Resources/RealtimeBridge
        type: folder
        buildPhase: resources
    dependencies:
      - target: EnchiridionTodayWidget
        embed: true
      - target: EnchiridionTaskShare
        embed: true
      - sdk: CarPlay.framework
      - sdk: AppIntents.framework
      - sdk: AVFoundation.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: Speech.framework
      - sdk: WebKit.framework
      - sdk: FoundationModels.framework
        weak: true
      - package: EnchiridionCore
        product: EnchiridionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rawkode.enchiridion
        PRODUCT_NAME: Enchiridion
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: Configuration/EnchiridionMobile.entitlements
        CODE_SIGN_STYLE: Automatic

  EnchiridionMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/EnchiridionMobileTests
    dependencies:
      - target: EnchiridionMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Enchiridion.app/Enchiridion

  EnchiridionTodayWidget:
    type: app-extension
    platform: iOS
    productName: EnchiridionTodayWidget
    info:
      path: Configuration/EnchiridionTodayWidget-Info.plist
      properties:
        CFBundleDisplayName: Enchiridion Today
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - Sources/TodayTasksWidget
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - package: EnchiridionCore
        product: EnchiridionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rawkode.enchiridion.today-widget
        PRODUCT_NAME: EnchiridionTodayWidget
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_ENTITLEMENTS: Configuration/EnchiridionTodayWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true

  EnchiridionTaskShare:
    type: app-extension
    platform: iOS
    productName: EnchiridionTaskShare
    info:
      path: Configuration/EnchiridionTaskShare-Info.plist
      properties:
        CFBundleDisplayName: Add to Enchiridion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 12
    sources:
      - Sources/TaskShareExtension
    dependencies:
      - sdk: Social.framework
      - sdk: UniformTypeIdentifiers.framework
      - package: EnchiridionCore
        product: EnchiridionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rawkode.enchiridion.task-share
        PRODUCT_NAME: EnchiridionTaskShare
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_ENTITLEMENTS: Configuration/EnchiridionTaskShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true

schemes:
  Enchiridion macOS:
    build:
      targets:
        EnchiridionMac: all
    run:
      config: Debug

  Enchiridion iOS:
    build:
      targets:
        EnchiridionMobile: all
        EnchiridionMobileTests: [test]
    run:
      config: Debug
    test:
      targets:
        - EnchiridionMobileTests
