# P0 SKELETON — CI for Enchiridion 2 (projects/enchiridion/).
#
# See /Users/rawkode/.claude/plans/cheeky-greeting-lampson.md,
# plan §Monorepo layout: ".github/workflows/enchiridion.yml — typecheck ->
# validate registry -> codegen -> test -> deploy" and plan §Execution
# practices ("Adversarial review is mandatory").
#
# Most of this workflow is still INERT in the sense that matters: most
# packages it builds are stubs, and the deploy job below is a documented
# placeholder — it does not run `wrangler deploy` yet, because none of the
# workers have anything real to deploy. ONE part is load-bearing already:
# `build`'s `bun test` + `swift-test`'s `swift test` jointly enforce plan
# §Verification's "Cross-language golden tests run in CI, release-blocking"
# for deterministic PageID/blob-id derivation (packages/graph-core/src/
# __fixtures__/golden-ids.json, asserted on both sides — see index.test.ts
# and apps/swift/Tests/EnchiridionCoreTests/GoldenIdsTests.swift). The rest
# becomes load-bearing once:
#   - "P0: VaultDO skeleton" gives workers/vault something to typecheck
#     against real bindings.
#   - "P1" gives packages/schema real registry validation
#     (plan: "Registry validation tests port the ModuleFoundationTests
#     cases") — that's the "validate registry" step from the plan's
#     one-line CI summary, not yet a separate job here since there's
#     nothing to validate against in the P0 skeleton.

name: enchiridion

on:
  push:
    branches: [main]
    paths:
      - "projects/enchiridion/**"
      - ".github/workflows/enchiridion.yml"
  pull_request:
    paths:
      - "projects/enchiridion/**"
      - ".github/workflows/enchiridion.yml"

defaults:
  run:
    working-directory: projects/enchiridion

jobs:
  build:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install

      # TODO(plan: "validate registry" step): once packages/schema
      # implements real ModuleRegistry-equivalent validation (P1), add a
      # dedicated `bun run validate-registry` step here, running before
      # typecheck so a bad supertag module fails fast with a clear error
      # rather than a generic type error.

      # `test` runs BEFORE `typecheck` on purpose: `bun run typecheck` (`tsc
      # --build`) compiles every *.test.ts to a sibling dist/*.test.js per
      # package (each tsconfig.json sets outDir "dist"). `bun test`'s
      # default discovery isn't scoped away from dist/ (see bunfig.toml's
      # `[test] pathIgnorePatterns`, which now excludes it as a second,
      # independent safety net), so running typecheck first used to make
      # `bun test` pick up both the source .test.ts files and their freshly
      # compiled dist/ copies, silently double-running the whole suite.
      # `bun test` only ever needs TS source (never compiled dist/ output),
      # so this ordering costs nothing.

      # Cross-language golden ID tests (plan §Verification, "Critical
      # invariant"): this job runs the TS half (`bun test`, below, covers
      # packages/graph-core/src/index.test.ts's assertions against
      # __fixtures__/golden-ids.json). The Swift half asserting the SAME
      # fixture file runs in the separate `swift-test` job below (apps/swift
      # needs a macOS runner for its Loro dependency, so it can't share this
      # ubuntu-latest job) — `deploy` needs both `build` and `swift-test`,
      # so a divergence in either language's derivation is release-blocking.

      - name: test
        run: bun test

      # TODO(plan: "codegen" step): once packages/codegen implements
      # generateSwiftSchema() (P1), add a step here that runs it and fails
      # the build if the generated apps/swift/Sources/EnchiridionSchema
      # output differs from what's committed (i.e. codegen was not
      # re-run/committed alongside a supertag change).

      - name: typecheck
        run: bun run typecheck

  swift-test:
    name: swift test (EnchiridionCore golden IDs)
    # apps/swift's Package.swift depends on loro-swift, which ships a
    # prebuilt xcframework binaryTarget (Apple-platforms only) — needs a
    # macOS runner even though EnchiridionCoreTests itself (the golden ID
    # tests added here) only depends on EnchiridionCore, because `swift
    # test` resolves the whole package graph.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # NOTE: apps/swift/Package.swift pins swift-tools-version 6.2 and
      # platforms .iOS(.v26)/.macOS(.v26) (plan Risk #1: Loro-on-Swift P0
      # skeleton). Verified locally against Xcode 27 (beta,
      # DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer, Swift
      # 6.4) — whether the macos-15 GitHub-hosted runner image ships a
      # toolchain new enough for those SDKs is UNVERIFIED from this sandbox
      # (no GitHub Actions runner access). If this job fails in CI with an
      # SDK/toolchain resolution error rather than a real test failure, pin
      # an Xcode version here (e.g. `maxim-lobanov/setup-xcode@v1`)
      # matching whatever Xcode ships the required SDKs on GitHub's runner
      # images, rather than loosening the deployment target.
      - name: swift build
        working-directory: projects/enchiridion/apps/swift
        run: swift build

      # Cross-language golden ID tests, Swift half (plan §Verification,
      # "Critical invariant"): GoldenIdsTests.swift
      # (Tests/EnchiridionCoreTests) loads the SAME
      # packages/graph-core/src/__fixtures__/golden-ids.json the `build`
      # job's `bun test` step asserts against, directly off disk. Release-
      # blocking — do not add `continue-on-error` here.
      - name: swift test
        working-directory: projects/enchiridion/apps/swift
        run: swift test

  deploy:
    name: deploy workers (placeholder)
    needs: [build, swift-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install

      # INERT placeholder: none of workers/vault, workers/gatekeeper-google,
      # workers/gadget-host build real Workers yet (see the "P0 SKELETON"
      # header comments in each worker's wrangler.jsonc — DO classes and R2
      # buckets referenced there don't exist). `wrangler deploy` is
      # commented out on purpose so a green CI run on this workflow never
      # implies a real deploy happened. Uncomment per-worker as each one's
      # P0/P2/P4 task lands, and add the CLOUDFLARE_API_TOKEN /
      # CLOUDFLARE_ACCOUNT_ID secrets this job will need at that point.
      - name: deploy workers/vault (placeholder — not run)
        run: |
          echo "wrangler deploy for workers/vault is not enabled yet."
          echo "Enable once P0 (VaultDO skeleton) + P0 (R2 blob routes) land."
          # cd workers/vault && bunx wrangler deploy

      - name: deploy workers/gatekeeper-google (placeholder — not run)
        run: |
          echo "wrangler deploy for workers/gatekeeper-google is not enabled yet."
          echo "Enable once P2 (Calendar gatekeeper) lands."
          # cd workers/gatekeeper-google && bunx wrangler deploy

      - name: deploy workers/gadget-host (placeholder — not run)
        run: |
          echo "wrangler deploy for workers/gadget-host is not enabled yet."
          echo "Enable once P4 (Gadgets) lands."
          # cd workers/gadget-host && bunx wrangler deploy
