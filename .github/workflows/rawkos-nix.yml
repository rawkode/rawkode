name: rawkOS (nix)

# Evaluate the rawkOS flake whenever the Nix configuration changes. The
# `nix`, `kree` and `multipass` path inputs live inside this monorepo, so a
# full checkout is required.
on:
  push:
    paths:
      - "nix/**"
      - "apps/kree/**"
      - "apps/multipass/**"
      - ".github/workflows/rawkos-nix.yml"
  pull_request:
    paths:
      - "nix/**"
      - "apps/kree/**"
      - "apps/multipass/**"
      - ".github/workflows/rawkos-nix.yml"

concurrency:
  group: rawkos-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      # Full work-Mac evaluation needs private CoreWeave sources. Public
      # systems/homes and fixtures each have a dedicated evaluation check.
      # A fresh Nix process per check bounds peak evaluator memory use.
      - name: Build repository checks
        shell: bash
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          checks=$(nix eval --json --no-update-lock-file "./nix#checks.$system" \
            --apply builtins.attrNames | jq -r '.[]')
          while IFS= read -r check; do
            echo "::group::$check"
            nix build --no-link --no-update-lock-file --no-eval-cache --print-build-logs \
              "./nix#checks.$system.\"$check\""
            echo "::endgroup::"
          done <<< "$checks"
