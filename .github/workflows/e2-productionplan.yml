# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: e2-productionPlan
on:
  push:
    branches:
    - spike/native-web-rich-editor
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: none
  pull-requests: none
jobs:
  e2-productionPlan:
    name: e2-productionPlan
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.53.2"
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -sSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: 2.9.5
    - name: Setup 1Password
      run: cuenv exec -- cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: 'Run pipeline: productionPlan'
      run: cuenv ci --pipeline productionPlan --path apps/e2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: production
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
