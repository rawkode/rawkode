# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: rawkode.dev-default
on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/rawkodedev-default.yml
    - cue.mod/**
    - websites/rawkode.dev/astro.config.mjs
    - websites/rawkode.dev/astro.config.mjs/**
    - websites/rawkode.dev/deno.json
    - websites/rawkode.dev/deno.json/**
    - websites/rawkode.dev/deno.lock
    - websites/rawkode.dev/deno.lock/**
    - websites/rawkode.dev/env.cue
    - websites/rawkode.dev/env.cue/**
    - websites/rawkode.dev/package.json
    - websites/rawkode.dev/package.json/**
    - websites/rawkode.dev/panda.config.ts
    - websites/rawkode.dev/panda.config.ts/**
    - websites/rawkode.dev/postcss.config.cjs
    - websites/rawkode.dev/postcss.config.cjs/**
    - websites/rawkode.dev/public/**/*
    - websites/rawkode.dev/schema/**
    - websites/rawkode.dev/scripts/**/*
    - websites/rawkode.dev/src/**/*
    - websites/rawkode.dev/styled-system/**/*
    - websites/rawkode.dev/wrangler.jsonc
    - websites/rawkode.dev/wrangler.jsonc/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
jobs:
  rawkode-dev-default:
    name: rawkode.dev-default
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.55.1"
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -sSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup 1Password
      run: cuenv exec -- cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        cache: true
        deno-version: v2.x
    - name: 'Run pipeline: default'
      run: cuenv ci --pipeline default --path websites/rawkode.dev
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: production
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
